<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yasmin Dania Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #d0f0c0;
      color: #333;
    }

    /* Scaled Up Header */
    header {
      background-color: #a8d5ba;
      padding: 40px 20px;
      margin: 0;
      text-align: center;
      font-size: 5em;
      font-weight: bold;
      color: #fff;
    }

    /* Fixed Menu Button */
    .openbtn {
      font-size: 24px;
      cursor: pointer;
      background-color: #a8d5ba;
      color: white;
      padding: 12px 18px;
      border: none;
      position: fixed;
      top: 35px;
      left: 20px;
      z-index: 20;
      border-radius: 6px;
      transition: background-color 0.2s;
    }

    .openbtn:hover {
      background-color: #8ec3a3;
    }

    /* Sidebar Navigation */
    .sidebar {
      height: 100%;
      width: 0;
      position: fixed;
      z-index: 10;
      top: 0;
      left: 0;
      background-color: #a8d5ba;
      overflow-x: hidden;
      transition: 0.3s;
      padding-top: 100px;
    }

    /* All sidebar buttons styled consistently */
    .sidebar button {
      display: block;
      background-color: #ffffff;
      margin: 10px auto;
      padding: 10px;
      width: 80%;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      color: #333;
    }

    .sidebar button:hover {
      background-color: #d9ead3;
    }

    .main-content {
      margin-left: 0;
      transition: margin-left 0.3s;
      padding: 20px;
    }
  </style>

  <script>
    function toggleNav() {
      const sidebar = document.getElementById("mySidebar");
      const main = document.getElementById("main");

      if (sidebar.style.width === "250px") {
        sidebar.style.width = "0";
        main.style.marginLeft = "0";
      } else {
        sidebar.style.width = "250px";
        main.style.marginLeft = "250px";
      }
    }
  </script>
</head>
<body>

  <!-- Sidebar containing all project & navigation buttons -->
  <div id="mySidebar" class="sidebar">
    <button onclick="location.href='about.html'">About Me</button>
    <button onclick="location.href='game.html'">Game Development Project</button>
    <button onclick="location.href='modelling.html'">Modelling Project</button>
    <button onclick="location.href='website.html'">Website Development Project</button>
    <button onclick="location.href='exit.html'">Exit</button>
  </div>

  <!-- Fixed Menu Button -->
  <button class="openbtn" onclick="toggleNav()">☰ Menu</button>

  <!-- Header -->
  <header>
    Welcome to my Portfolio
  </header>

  <!-- Blank Main Content Area -->
  <div id="main" class="main-content">
  </div>

</body>
</html>
