<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game Development Projects</title>
  <style>
    body {
      margin: 0;
      font-family: Times New Roman, sans-serif;
      background-color: #d8f3dc;
      color: #333;
    }

    header {
      background-color: #b7e4c7;
      padding: 0;
      text-align: center;
      transition: margin-left 0.3s;
      overflow: hidden;
    }

    header img {
      width: 100%;
      height: auto;
      max-height: 200px;
      object-fit: cover;
      display: block;
    }

    .sidebar {
      height: 100%;
      width: 0;
      position: fixed;
      z-index: 1;
      top: 0;
      left: 0;
      background-color: #40916c;
      overflow-x: hidden;
      transition: 0.3s;
      padding-top: 80px;
    }

    .sidebar img {
      width: 80%;
      display: block;
      margin: 0 auto 20px;
    }

    .sidebar a {
      display: block;
      color: white;
      padding: 16px;
      text-decoration: none;
      text-align: center;
    }

    .sidebar a:hover {
      background-color: #52b788;
    }

    .openbtn {
      font-size: 20px;
      cursor: pointer;
      background-color: #74c69d;
      color: white;
      padding: 10px 15px;
      border: none;
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 2;
    }

    .main-content {
      margin-left: 0;
      transition: margin-left 0.3s;
      padding: 60px 20px 20px 20px;
    }

    .header-message {
      text-align: center;
      font-size: 22px; /* Fixed font size in px so it won't auto-scale */
      font-weight: bold;
      color: #1b4332;
      margin-bottom: 20px;
    }

    .projects-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 columns grid */
      gap: 30px; /* spacing between items */
      margin-top: 30px;
      justify-items: center; /* center the cards in each grid cell */
    }

    .project-link {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      
      /* ======================================================== */
      /* ADJUST BOX SIZE HERE: change width and height values below */
      /* ======================================================== */
      width: 220px;  /* Box width (adjust for larger/smaller squares) */
      height: 220px; /* Box height (must match width to maintain a square) */
      box-sizing: border-box; /* Includes padding within the specified size */
      
      /* Flexbox alignment to center text vertically and horizontally */
      display: flex;
      justify-content: center;
      align-items: center;
      
      text-align: center;
      font-size: 18px;
      text-decoration: none;
      color: #1b4332;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    /* Positions "Others game" in column 2 (under Symphony Shop Simulation VR) */
    .others-box {
      grid-column: 2;
    }

    .project-link:hover {
      background-color: #a3d9a5;
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }

  </style>
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById("mySidebar");
      const main = document.getElementById("main");
      const header = document.querySelector("header");

      if (sidebar.style.width === "250px") {
        sidebar.style.width = "0";
        main.style.marginLeft = "0";
        header.style.marginLeft = "0";
      } else {
        sidebar.style.width = "250px";
        main.style.marginLeft = "250px";
        header.style.marginLeft = "250px";
      }
    }
  </script>
</head>
<body>

<div id="mySidebar" class="sidebar">
  <a href="index.html">Home</a>
  <a href="modelling.html">3D Model Project</a>
  <a href="website.html">Website Development Project</a>
  <a href="video.html">Video Editing Project</a>
  <a href="poster.html">Poster</a>
  <a href="exit.html">Exit</a>
</div>

<button class="openbtn" onclick="toggleSidebar()">☰ Menu</button>

<header>
  <img src="game header.jpg" alt="Game Development Header">
</header>

<div id="main" class="main-content">
  <!-- Centered Message Above Boxes -->
  <div class="header-message">
    Welcome to my Game Development Showcase! Select a project below to explore.
  </div>
  
  <div class="projects-container">
    <a class="project-link" href="mathquest.html">Final Year Project - Math Quest: Game Based Learning</a>
    <a class="project-link" href="symphonyvr.html">Symphony Shop Simulation VR</a>
    <a class="project-link" href="waterguardian.html">Water Guardian, Heroes of Tomorrow</a>
    <a class="project-link others-box" href="others.html">Others game</a>
  </div>
</div>

</body>
</html>
